[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
repository = "https://github.com/zedicit/S-5thou-under"
# license = "MIT OR Apache-2.0"  # TODO: decide (docs/OPEN_QUESTIONS.md A7)
publish = false

[workspace.dependencies]
s5k-model = { path = "crates/s5k-model" }
s5k-l5x = { path = "crates/s5k-l5x" }
s5k-logic = { path = "crates/s5k-logic" }
s5k-analysis = { path = "crates/s5k-analysis" }
s5k-render = { path = "crates/s5k-render" }

anyhow = "1"
clap = { version = "4", features = ["derive"] }
quick-xml = "0.37"
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
print_stdout = "warn"
print_stderr = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
